name: Compiler APK de test ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Vérifier et construire le projet Flutter
        run: |
          flutter --version
          python3 scripts/check_source.py
          bash build_flutter.sh --debug
      - name: Vérifier la connexion native et les autorisations
        run: |
          grep -q 'bindProcessToNetwork' .flutter_build/android/app/src/main/kotlin/fr/compagnon/compagnon_atelier/MainActivity.kt
          grep -q 'networkSecurityConfig' .flutter_build/android/app/src/main/AndroidManifest.xml
      - name: Vérifier la présence du véritable paquet APK
        run: |
          test -s .flutter_build/build/app/outputs/flutter-apk/app-debug.apk
          file .flutter_build/build/app/outputs/flutter-apk/app-debug.apk
          unzip -t .flutter_build/build/app/outputs/flutter-apk/app-debug.apk | tail -1
          cp .flutter_build/build/app/outputs/flutter-apk/app-debug.apk CompagnonAtelier_Reboot_TEST_ARM64.apk
          sha256sum CompagnonAtelier_Reboot_TEST_ARM64.apk > SHA256_APK.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CompagnonAtelier_Reboot_TEST_ARM64
          path: |
            CompagnonAtelier_Reboot_TEST_ARM64.apk
            SHA256_APK.txt
          retention-days: 14
