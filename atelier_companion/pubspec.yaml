name: atelier_companion
description: Application atelier indépendante (code original, données fictives).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.0
  intl: any  # version imposée par flutter_localizations (SDK Flutter)

  # Jalons suivants (brancher quand nécessaire) :
  # camera: ^0.11.0                         # capture photo
  # torch_light: ^1.1.0                     # torche matérielle
  # google_mlkit_text_recognition: ^0.13.0  # OCR VIN / plaque on-device
  # flutter_local_notifications: ^17.2.0    # notifications locales
  # drift + sqlite3_flutter_libs            # historique local SQLite

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
